<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
{% include 'students/_form_style.html' %}
<body class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4">
        <h2 class="mb-4">Reset Password</h2>
        <p class="text-muted">Enter the e-mail address of your account and we'll send you a link to set a new password.</p>
        {% if form.email.errors %}
        <div class="alert alert-danger py-2">{{ form.email.errors }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_email">E-mail address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>
        <a href="{% url 'login' %}" class="btn btn-secondary w-100 mt-2">Back to login</a>
    </div>
</body>
</html>
