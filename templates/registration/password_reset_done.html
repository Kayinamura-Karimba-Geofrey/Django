<!DOCTYPE html>
<html>
<head>
    <title>Check Your E-mail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4 text-center">
        <h3 class="mb-3">Check your e-mail</h3>
        <p>If an account exists for the address you entered, a password reset link is on its way.
           In development, the e-mail is printed to the console running <code>runserver</code>.</p>
        <a href="{% url 'login' %}" class="btn btn-secondary w-100">Back to login</a>
    </div>
</body>
</html>
