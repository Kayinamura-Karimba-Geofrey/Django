<!DOCTYPE html>
<html>
<head>
    <title>Confirm Delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <div class="card shadow p-4 text-center">
        <h3 class="text-danger mb-3">Confirm Deletion</h3>
        <p>Are you sure you want to delete <strong>{{ student.first_name }} {{ student.last_name }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100">Yes, Delete</button>
        </form>
        <a href="{% url 'student_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </div>
</body>
</html>
