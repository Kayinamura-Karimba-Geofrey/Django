<!DOCTYPE html>
<html>
<head>
    <title>{{ action }} Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" style="max-width: 600px;">
    <div class="card shadow p-4">
        <h2 class="mb-4">{{ action }} Student</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-3">Save Student</button>
        </form>
        <a href="{% url 'student_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </div>
</body>
</html>
