{# Bootstrap-like styling for Django form fields rendered as {{ form.field }} #}
<style>
  input[type="password"],
  input[type="email"],
  input[type="text"] {
    display: block;
    width: 100%;
    padding: 0.375rem 0.75rem;
    font-size: 1rem;
    line-height: 1.5;
    color: #212529;
    background-color: #fff;
    border: 1px solid #ced4da;
    border-radius: 0.375rem;
  }
  input[type="password"]:focus,
  input[type="email"]:focus,
  input[type="text"]:focus {
    border-color: #86b7fe;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
  }
  ul.errorlist {
    list-style: none;
    margin: 0.25rem 0 0;
    padding: 0;
    color: #dc3545;
    font-size: 0.875rem;
  }
</style>
