<!DOCTYPE html>
<html>
<head>
    <title>Student Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Student Records Directory</h2>
        <a href="{% url 'student_create' %}" class="btn btn-primary">Add New Student</a>
    </div>
    <table class="table table-striped table-bordered shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Registered Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.first_name }} {{ student.last_name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.course }}</td>
                <td>{{ student.registration_date }}</td>
                <td>
                    <a href="{% url 'student_update' student.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'student_delete' student.id %}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="5" class="text-center text-muted">No students found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
